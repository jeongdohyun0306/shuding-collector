<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슈딩이 컬렉터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8; --panel:#fffdf9; --ink:#2b2622; --sub:#6f655c; --line:#e3d9cc;
  --accent:#d26b00; --brown:#8b4a2b; --bad:#b4401a; --good:#2f7d4f;
  --shadow:0 10px 30px rgba(60,40,20,.14); --dock-h:180px; --head-h:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a17; --panel:#272320; --ink:#f1ebe4; --sub:#b2a69a; --line:#3a342f;
    --accent:#ef8a1f; --brown:#c27a52; --bad:#f08a64; --good:#6cc28f; --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a17; --panel:#272320; --ink:#f1ebe4; --sub:#b2a69a; --line:#3a342f;
  --accent:#ef8a1f; --brown:#c27a52; --bad:#f08a64; --good:#6cc28f; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700}
header .count{color:var(--sub);font-size:13px}
header .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--sub);padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#wall{columns:5 220px;column-gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(var(--dock-h) + 40px) max(16px,env(safe-area-inset-left,0px))}
.ph{break-inside:avoid;margin:0 0 12px;border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.08);position:relative;transition:transform .3s,box-shadow .3s,opacity .3s;max-width:100%}
.ph img{display:block;width:100%;height:auto}
.ph.hit{box-shadow:0 0 0 4px var(--accent),var(--shadow);z-index:2}
.ph.cur{transform:scale(1.02)}
.dim .ph:not(.hit){opacity:.4}
.ph .badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;display:none}
.ph.hit .badge{display:block}
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(760px,calc(100% - 24px));max-height:55vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;z-index:10}
.row{display:flex;gap:8px;align-items:center}
#q{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);min-width:0}
#go{border:0;background:var(--brown);color:#fff;border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer;flex:none}
.res{margin-top:10px}
.lab{font-size:12px;color:var(--sub);margin:0 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab b{color:var(--ink)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.strip button{padding:0;border:2px solid transparent;border-radius:9px;background:none;cursor:pointer;flex:none;line-height:0}
.strip img{height:56px;width:56px;object-fit:cover;border-radius:7px}
.strip button[aria-current="true"]{border-color:var(--accent)}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--bg)}
.chip.neg{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.chip.pos{border-color:color-mix(in srgb,var(--good) 50%,transparent);color:var(--good)}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ex button{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.ex button:hover{color:var(--ink);border-color:var(--accent)}
#box{position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:20;padding:16px}
#box:not([hidden]){display:flex}
#box img{max-width:100%;max-height:100%;border-radius:10px}
@media (max-width:600px){
  #wall{columns:2 140px;column-gap:8px}
  .ph{margin-bottom:8px}
  header h1{font-size:16px}
  .seg button{padding:6px 10px}
  .strip img{height:48px;width:48px}
  #dock.searched .ex{display:none}
}
@media (prefers-reduced-motion: reduce){.ph{transition:none}}
</style>
</head>
<body>
<header id="head">
  <h1>슈딩이 컬렉터</h1><span class="count" id="count"></span><span class="sp"></span>
  <div class="seg" id="mode" role="group" aria-label="검색 방식">
    <button data-m="v2" aria-pressed="true">개선판</button><button data-m="v1" aria-pressed="false">원래 방식</button><button data-m="both" aria-pressed="false">비교</button>
  </div>
</header>
<main id="wall"></main>
<div id="dock">
  <form class="row" id="f"><input id="q" placeholder="찾고 싶은 모습을 한국어로 적어 보세요" autocomplete="off" maxlength="200" aria-label="검색어"><button id="go" type="submit" aria-label="검색">&rarr;</button></form>
  <div id="out" aria-live="polite"></div>
  <div class="ex" id="ex"></div>
</div>
<div id="box" hidden><img alt=""></div>
<script>
const EX=["안경을 안 쓴 슈딩이","하품하는 슈딩이","풀밭에 있는 슈딩이","사람 없이 소파에 있는 슈딩이","자지 않고 침대 위에 있는 슈딩이","상자 안에서 카메라를 보는 슈딩이"];
let mode="v2",photos=[],last=null,cur={key:null,pos:0},seq=0,name="슈딩이";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
new ResizeObserver(()=>{document.documentElement.style.setProperty("--dock-h",$("#dock").offsetHeight+"px");document.documentElement.style.setProperty("--head-h",$("#head").offsetHeight+"px")}).observe($("#dock"));
async function init(){
  let r;
  try{r=await fetch("/api/photos").then(x=>{if(!x.ok)throw new Error(x.status);return x.json()})}
  catch(e){$("#out").innerHTML=`<div class="err">사진 목록을 불러오지 못했습니다. 서버가 켜져 있는지 확인하세요.</div>`;return}
  photos=r.photos;name=r.name||name;$("#count").textContent=photos.length+"장";
  $("#wall").innerHTML=photos.map(p=>`<figure class="ph" id="ph${p.i}" style="aspect-ratio:${p.w}/${p.h}"><span class="badge"></span><img loading="lazy" src="/thumb/${p.i}" alt="${esc(p.id)}"></figure>`).join("");
  $("#wall").addEventListener("click",e=>{const f=e.target.closest(".ph");if(f)openBox(+f.id.slice(2))});
  $("#ex").innerHTML=EX.map(t=>`<button type="button">${esc(t.replace("슈딩이",name))}</button>`).join("");
  $("#ex").addEventListener("click",e=>{if(e.target.tagName==="BUTTON"){$("#q").value=e.target.textContent;search()}});
}
function openBox(i){$("#box img").src=`/thumb/${i}?s=1400`;$("#box").hidden=false}
function closeBox(){$("#box").hidden=true}
$("#box").onclick=closeBox;
$("#mode").onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$("#mode").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));if($("#q").value.trim())search()};
$("#f").onsubmit=e=>{e.preventDefault();search()};
async function search(){
  const q=$("#q").value.trim();if(!q)return;
  const my=++seq;
  $("#out").innerHTML=`<div class="res"><div class="lab">찾는 중</div></div>`;
  let data;
  try{
    const r=await fetch(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}`);
    data=await r.json();
    if(!r.ok)throw new Error(data.error||("오류 "+r.status));
  }catch(e){if(my===seq)$("#out").innerHTML=`<div class="err">${esc(e.message||"검색하지 못했습니다.")}</div>`;return}
  if(my!==seq)return;
  last=data;render();
}
function strip(key,res){return `<div class="strip" data-k="${key}">${res.results.map((r,n)=>`<button type="button" data-n="${n}" aria-label="${n+1}위로 이동"><img src="/thumb/${r.i}" alt=""></button>`).join("")}</div>`}
function render(){
  let h="";
  if(last.v2){
    const v=last.v2;
    const chips=[`<span class="chip pos">찾는 것: ${esc(v.pos)}</span>`].concat(v.neg.map(n=>`<span class="chip neg">빼는 것: ${esc(n)}</span>`));
    h+=`<div class="res"><div class="lab"><b>${mode==="both"?"개선판":"결과"}</b>${chips.join("")}<span>${v.ms} ms</span></div>${strip("v2",v)}</div>`;
  }
  if(last.v1){h+=`<div class="res"><div class="lab"><b>${mode==="both"?"원래 방식":"결과"}</b><span>${last.v1.ms} ms</span></div>${strip("v1",last.v1)}</div>`}
  $("#out").innerHTML=h;
  $("#dock").classList.add("searched");
  $("#out").querySelectorAll(".strip").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(b)focusRes(s.dataset.k,+b.dataset.n)}));
  focusRes(last.v2?"v2":"v1",0);
}
function focusRes(key,n){
  const res=(last&&last[key])?last[key].results:[];if(!res.length)return;
  cur={key,pos:n};
  document.querySelectorAll(".ph.hit,.ph.cur").forEach(e=>e.classList.remove("hit","cur"));
  $("#wall").classList.add("dim");
  res.forEach((r,k)=>{const el=$("#ph"+r.i);if(el){el.classList.add("hit");el.querySelector(".badge").textContent=(k+1)+"위"}});
  document.querySelectorAll(".strip button").forEach(b=>b.setAttribute("aria-current",b.closest(".strip").dataset.k===key&&+b.dataset.n===n));
  const el=$("#ph"+res[n].i);if(!el)return;
  el.classList.add("cur");
  const headH=$("#head").offsetHeight, dockH=$("#dock").offsetHeight;
  const room=window.innerHeight-headH-dockH-24;
  const r=el.getBoundingClientRect();
  const top=window.scrollY+r.top-headH-12-Math.max(0,(room-r.height)/2);
  window.scrollTo({top:Math.max(0,top),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function clearHits(){$("#wall").classList.remove("dim");document.querySelectorAll(".ph.hit,.ph.cur").forEach(x=>x.classList.remove("hit","cur"))}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("#box").hidden)closeBox();else clearHits();return}
  if(!$("#box").hidden||!last||document.activeElement===$("#q"))return;
  const res=(cur.key&&last[cur.key])?last[cur.key].results:[];
  if(e.key==="ArrowRight")focusRes(cur.key,Math.min(res.length-1,cur.pos+1));
  if(e.key==="ArrowLeft")focusRes(cur.key,Math.max(0,cur.pos-1));
});
init();
</script>
</body>
</html>
